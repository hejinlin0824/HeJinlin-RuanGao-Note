<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>原文证据与 OCR 清洗工作台</title>
<style>
:root{color-scheme:light;--ink:#17243a;--muted:#718096;--line:#e4eaf2;--blue:#315ed5;--bg:#f4f7fb;--card:#fff;--green:#16845b;--amber:#a96b12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif}.shell{max-width:1440px;margin:auto;padding:26px 24px 60px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--blue);font-weight:800}.top h1{font-size:25px;margin:4px 0}.sub{color:var(--muted);margin:0}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 5px 22px #1b315008}.toolbar{display:grid;grid-template-columns:1.2fr 1.2fr 1.6fr auto;gap:12px;align-items:end}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}select,input{width:100%;height:40px;border:1px solid #d8e0eb;border-radius:8px;padding:0 11px;background:white;color:var(--ink);font:inherit}button{border:0;border-radius:8px;padding:10px 14px;background:var(--blue);color:white;font:inherit;font-weight:650;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.ghost{background:#edf2fb;color:#34517f}.danger{background:#fff0ed;color:#a33d31}.status{margin-top:12px;border-radius:8px;background:#f0f4fa;color:#53627a;padding:10px 12px;white-space:pre-wrap}.status.ok{background:#eaf7f1;color:#176c4c}.status.err{background:#fff0ed;color:#a33d31}.actions{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.stat{background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:12px}.stat b{display:block;font-size:23px;line-height:1.3}.stat span{font-size:12px;color:var(--muted)}.workspace{display:grid;grid-template-columns:minmax(340px, .95fr) minmax(420px,1.35fr);gap:16px;align-items:start}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.section-head h2{font-size:16px;margin:0}.filters{display:flex;gap:6px;flex-wrap:wrap}.filters button{font-size:12px;padding:6px 10px}.filters button.active{background:#233f83}.block-list{display:flex;flex-direction:column;gap:8px;max-height:680px;overflow:auto}.block{border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;background:white}.block.selected{border-color:#6c8be5;box-shadow:0 0 0 2px #315ed51a}.block-top{display:flex;justify-content:space-between;gap:10px}.tag{font-size:11px;border-radius:5px;padding:2px 7px;background:#eef2f8;color:#56647b;white-space:nowrap}.tag.warn{background:#fff3df;color:#98600e}.block p{margin:7px 0 0;color:#526078;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}.empty{padding:30px 14px;text-align:center;color:#8793a6;border:1px dashed #d5deea;border-radius:10px}.detail{min-height:280px}.detail-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.detail-text{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f9fc;border:1px solid var(--line);border-radius:9px;padding:15px;min-height:120px;max-height:420px;overflow:auto}.source-img{max-width:100%;max-height:520px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#f6f7f9}.candidate{border:1px solid #f0dfbf;background:#fffaf1;padding:12px;border-radius:9px;margin:8px 0}.candidate small{color:#8b651e}.candidate p{margin:5px 0;overflow-wrap:anywhere}.run-item{padding:10px;border:1px solid var(--line);border-radius:9px;margin:7px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:var(--muted);font-size:12px}.hidden{display:none!important}@media(max-width:850px){.toolbar{grid-template-columns:1fr 1fr}.workspace{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.shell{padding:18px 12px}.toolbar{grid-template-columns:1fr}.top{display:block}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><main class="shell">
<header class="top"><div><div class="eyebrow">RUANGAO NOTE / TP-05</div><h1>原文证据与 OCR 清洗工作台</h1><p class="sub">从 OCR 处理记录生成页级原文块，定位教材原页，并检查水印、脚注和重复页眉候选。</p></div><div class="actions"><button class="ghost" id="refreshAll">刷新数据</button></div></header>
<section class="panel"><div class="toolbar">
<div class="field"><label for="book">教材</label><select id="book"><option value="">加载中…</option></select></div>
<div class="field"><label for="chapter">章节</label><select id="chapter"><option value="">先选择教材</option></select></div>
<div class="field"><label for="run">OCR 处理记录</label><select id="run"><option value="">先选择章节</option></select></div>
<div class="actions"><button id="loadBlocks" disabled>载入原文块</button></div>
</div><div class="actions" style="margin-top:12px"><button id="materialize" disabled>生成 / 补全原文块</button><button class="ghost" id="reloadRuns" disabled>刷新处理记录</button><button class="ghost" id="exportMd" disabled>导出锚点 Markdown</button></div>
<div id="status" class="status">正在连接本地服务…</div>
<div id="diagnosis" class="status hidden"></div>
<div class="stats"><div class="stat"><b id="sRun">—</b><span>当前 OCR 状态</span></div><div class="stat"><b id="sBlocks">0</b><span>原文块数量</span></div><div class="stat"><b id="sCandidates">0</b><span>清洗候选数量</span></div><div class="stat"><b id="sUnmapped">—</b><span>未映射布局项</span></div></div>
</section>
<section class="workspace">
<div class="panel"><div class="section-head"><h2>原文块列表</h2><div class="filters"><button class="active" data-filter="all">全部</button><button class="ghost" data-filter="candidate">候选项</button></div></div><div class="field" style="margin-bottom:10px"><input id="search" placeholder="搜索原文内容 / block key"></div><div id="blocks" class="block-list"><div class="empty">选择 OCR 记录后载入原文块</div></div></div>
<div class="panel"><div class="section-head"><h2>证据详情</h2><span class="muted" id="selectedKey">尚未选择原文块</span></div><div id="detail" class="detail"><div class="empty">点击左侧原文块，查看文本、页码和原始教材页面。</div></div></div>
</section>
<section class="panel"><div class="section-head"><h2>清洗候选审核清单</h2><span class="muted">只读提示 · 不会自动删除原文</span></div><div id="candidateList"><div class="empty">载入原文块后显示候选项</div></div></section>
<section class="panel"><div class="section-head"><h2>处理质量报告</h2><span class="muted">来自当前 OCR 版本</span></div><pre id="report" class="detail-text">尚无报告</pre></section>
</main>
<script>
const $=id=>document.getElementById(id);let runs=[],blocks=[],report={},selected=null,filter="all",markdown="";
async function api(path,options){const res=await fetch(path,options||{});const raw=await res.text();let data;try{data=raw?JSON.parse(raw):null}catch{data=raw}if(!res.ok){const detail=data&&data.detail?data.detail:raw;throw Error(typeof detail==="string"?detail:JSON.stringify(detail))}return data}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function status(text,kind=""){ $("status").textContent=text;$("status").className="status "+kind}
function chapterId(){return $("chapter").value}function runId(){return $("run").value}
function candidates(){return Array.isArray(report.cleanup_candidates)?report.cleanup_candidates:[]}
function candidateMap(){return new Map(candidates().map(x=>[x.block_key,x]))}
function renderDiagnosis(){
 const node=$("diagnosis");
 const warnings=Array.isArray(report.warnings)?report.warnings:[];
 const diag=report.artifact_diagnostics||{};
 const hasData=Object.keys(report).length>0;
 if(!hasData){node.classList.add("hidden");return}
 const noLayout=report.layout_entry_count===0||!report.layout_source;
 const jsonNames=Array.isArray(diag.json_files)?diag.json_files:[];
 const mdNames=Array.isArray(diag.markdown_files)?diag.markdown_files:[];
 const summary=noLayout
  ?"尚未得到页级布局块，因此 0 个未映射项不能解释为映射成功。"
  :"已读取 "+(report.layout_entry_count??0)+" 条布局项，其中映射 "+(report.mapped_entries??0)+" 条。";
 node.classList.remove("hidden");
 node.className="status "+(noLayout||warnings.length?"err":"ok");
 node.innerHTML="<strong>诊断结论：</strong>"+esc(summary)
  +(warnings.length?"<div style='margin-top:6px'>"+warnings.map(esc).join("<br>")+"</div>":"")
  +"<div style='margin-top:7px;font-size:12px'>JSON 文件："+esc(jsonNames.join("、")||"无")
  +"<br>Markdown 文件："+esc(mdNames.join("、")||"无")
  +"<br>布局文件："+esc((diag.content_list_candidates||[]).join("、")||"未发现 content_list 文件")+"</div>";
}
async function init(){try{const data=await api("/api/books");$("book").innerHTML='<option value="">选择教材</option>'+data.map(b=>'<option value="'+esc(b.id)+'">'+esc(b.title)+(b.edition?' · '+esc(b.edition):"")+'</option>').join("");status(data.length?"已连接本地数据库。请选择教材和章节。":"数据库中还没有教材，请先到教材管理功能创建教材。",data.length?"ok":"");}catch(e){status("无法读取教材列表："+e.message,"err")}}
async function loadChapters(){const id=$("book").value;$("chapter").innerHTML='<option value="">加载中…</option>';$("run").innerHTML='<option value="">先选择章节</option>';blocks=[];renderBlocks();if(!id){$("chapter").innerHTML='<option value="">选择教材</option>';return}const data=await api("/api/books/"+encodeURIComponent(id)+"/chapters");$("chapter").innerHTML='<option value="">选择章节</option>'+data.map(c=>'<option value="'+esc(c.id)+'">第 '+c.chapter_number+' 章 · '+esc(c.title)+'</option>').join("");}
async function loadRuns(){if(!chapterId())return;runs=await api("/api/chapters/"+encodeURIComponent(chapterId())+"/ocr-runs");$("run").innerHTML='<option value="">选择 OCR 处理记录</option>'+runs.map(r=>'<option value="'+esc(r.id)+'">'+esc((r.created_at||"").replace("T"," ").slice(0,19))+' · '+esc(r.status)+' · '+esc(r.id.slice(0,8))+'</option>').join("");$("reloadRuns").disabled=false;status("已载入 "+runs.length+" 条 OCR 处理记录。", "ok");}
function activeRun(){return runs.find(r=>r.id===runId())}
function setStats(){const r=activeRun();$("sRun").textContent=r?r.status:"—";$("sBlocks").textContent=blocks.length;$("sCandidates").textContent=candidates().length;$("sUnmapped").textContent=report.layout_entry_count===0?"未读取":(report.unmapped_entries??"—");$("materialize").disabled=!r||r.status!=="succeeded";$("loadBlocks").disabled=!r;$("exportMd").disabled=!blocks.length;renderDiagnosis()}
async function selectRun(){const r=activeRun();blocks=[];selected=null;report=r?.quality_report?.source_blocks||{};markdown=r?.normalized_result?.anchored_markdown||"";renderBlocks();$("candidateList").innerHTML='<div class="empty">载入原文块后显示候选项</div>';if(!r){setStats();return} $("report").textContent=JSON.stringify(report,null,2);setStats();if(r.status==="succeeded")await loadBlocks();else status("当前 OCR 记录状态："+r.status+(r.error_message?"；"+r.error_message:""),r.status==="failed"?"err":"");}
async function loadBlocks(){if(!chapterId()||!runId())return;try{blocks=await api("/api/chapters/"+encodeURIComponent(chapterId())+"/ocr-runs/"+encodeURIComponent(runId())+"/source-blocks");const r=activeRun();report=r?.quality_report?.source_blocks||report||{};markdown=r?.normalized_result?.anchored_markdown||markdown;selected=blocks[0]||null;renderBlocks();renderCandidates();$("report").textContent=JSON.stringify(report,null,2);setStats();const warnings=Array.isArray(report.warnings)?report.warnings:[];
 status(blocks.length
  ?"已载入 "+blocks.length+" 个页级原文块。"
  :("当前记录没有生成页级原文块。"+(warnings.length?"\\n原因："+warnings.join("；"):" 请查看下方诊断报告。")),
  blocks.length&&!warnings.length?"ok":"err");}catch(e){status("载入原文块失败："+e.message,"err")}}
async function materialize(){const r=activeRun();if(!r)return;const btn=$("materialize");btn.disabled=true;status("正在生成原文块，请稍候…");try{const data=await api("/api/chapters/"+encodeURIComponent(chapterId())+"/ocr-runs/"+encodeURIComponent(runId())+"/source-blocks",{method:"POST"});blocks=data.items||[];report=data.report||{};markdown=data.anchored_markdown||"";const idx=runs.findIndex(x=>x.id===r.id);if(idx>=0){runs[idx].quality_report={...(runs[idx].quality_report||{}),source_blocks:report};runs[idx].normalized_result={...(runs[idx].normalized_result||{}),anchored_markdown:markdown}}selected=blocks[0]||null;renderBlocks();renderCandidates();$("report").textContent=JSON.stringify(report,null,2);setStats();const warnings=Array.isArray(report.warnings)?report.warnings:[];
 status("完成：生成 / 复用了 "+blocks.length+" 个原文块。原文没有被删除。"
  +(warnings.length?"\\n诊断："+warnings.join("；"):""),
  warnings.length||!blocks.length?"err":"ok");}catch(e){status("生成失败："+e.message,"err")}finally{btn.disabled=false}}
function renderBlocks(){const q=$("search").value.trim().toLowerCase(),cmap=candidateMap();const shown=blocks.filter(b=>{const c=cmap.has(b.block_key);return(filter!=="candidate"||c)&&(!q||(b.text||"").toLowerCase().includes(q)||b.block_key.toLowerCase().includes(q))});$("blocks").innerHTML=shown.length?shown.map(b=>{const c=cmap.get(b.block_key);return '<div class="block '+(selected?.id===b.id?'selected':'')+'" data-id="'+esc(b.id)+'"><div class="block-top"><strong>'+esc(b.block_type)+' · #'+b.sort_order+'</strong><span class="tag '+(c?'warn':'')+'">'+(c?'待检查':'原文')+'</span></div><div class="muted">'+esc(b.block_key)+'</div><p>'+esc(b.text||"（该块没有可提取文本，请检查原页）")+'</p></div>'}).join(""):'<div class="empty">没有匹配的原文块</div>';$("blocks").querySelectorAll(".block").forEach(node=>node.onclick=()=>{selected=blocks.find(b=>b.id===node.dataset.id);renderBlocks();renderDetail()});renderDetail();setStats()}
function renderDetail(){if(!selected){$("selectedKey").textContent="尚未选择";$("detail").innerHTML='<div class="empty">选择左侧原文块查看详情</div>';return}const c=candidateMap().get(selected.block_key);$("selectedKey").textContent=selected.block_key;$("detail").innerHTML='<div class="detail-meta"><span class="tag">类型：'+esc(selected.block_type)+'</span><span class="tag">版本：'+selected.version+'</span><span class="tag">顺序：'+selected.sort_order+'</span>'+(c?'<span class="tag warn">清洗候选</span>':'')+'</div><div class="muted" style="margin-bottom:6px">原文内容（只读）</div><div class="detail-text">'+esc(selected.text||"（空文本块）")+'</div><div class="muted" style="margin:12px 0 6px">原始教材页面</div><img class="source-img" src="'+esc(selected.image_url)+'" alt="教材原始页面" onerror="this.outerHTML=\'<div class=empty>原始页面图片加载失败</div>\'"><div class="muted" style="margin-top:8px">page_id：'+esc(selected.page_id)+' · content_hash：'+esc(selected.content_hash||"—")+'</div>'+(selected.bbox?'<div class="muted">bbox：'+esc(JSON.stringify(selected.bbox))+'</div>':'')+(c?'<div class="candidate"><strong>清洗提示</strong><p>'+c.reasons.map(esc).join("、")+'</p><small>系统建议：人工检查；当前仅提示，不修改、不删除原文。</small></div>':'')}
function renderCandidates(){const list=candidates();$("candidateList").innerHTML=list.length?list.map(c=>'<div class="candidate"><div class="block-top"><strong>'+esc(c.reasons.join(" · "))+'</strong><span class="tag warn">review_only</span></div><p>'+esc(c.text_preview)+'</p><small>页 ID：'+esc(c.page_id)+' · '+esc(c.block_key)+'</small><div style="margin-top:8px"><button class="ghost" data-key="'+esc(c.block_key)+'">查看对应原文块</button></div></div>').join(""):'<div class="empty">当前没有检测到清洗候选项；这不代表 OCR 内容一定完全正确。</div>';$("candidateList").querySelectorAll("button[data-key]").forEach(b=>b.onclick=()=>{selected=blocks.find(x=>x.block_key===b.dataset.key)||null;filter="all";document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x.dataset.filter===filter));renderBlocks();$("detail").scrollIntoView({behavior:"smooth",block:"center"})})}
$("book").onchange=()=>loadChapters().catch(e=>status(e.message,"err"));$("chapter").onchange=()=>loadRuns().catch(e=>status(e.message,"err"));$("run").onchange=()=>selectRun().catch(e=>status(e.message,"err"));$("loadBlocks").onclick=loadBlocks;$("materialize").onclick=materialize;$("reloadRuns").onclick=()=>loadRuns().catch(e=>status(e.message,"err"));$("refreshAll").onclick=()=>init().then(()=>loadChapters());$("search").oninput=renderBlocks;document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));renderBlocks()});$("exportMd").onclick=()=>{if(!markdown){status("当前记录没有锚点 Markdown。请先生成原文块。","err");return}const blob=new Blob([markdown],{type:"text/markdown;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="chapter-source-anchored.md";a.click();URL.revokeObjectURL(url)};init();
</script></body></html>
