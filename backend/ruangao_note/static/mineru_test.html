<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MinerU 批量解析测试台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#172033;font:15px/1.6 "Microsoft YaHei",system-ui,sans-serif}.wrap{max-width:1000px;margin:28px auto;padding:0 18px}h1{font-size:26px}h2{font-size:18px;margin:0 0 12px}.card{background:white;border:1px solid #e1e6ef;border-radius:13px;padding:20px;margin:14px 0;box-shadow:0 4px 16px #15223b08}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:13px;color:#596579;margin:8px 0 5px}input,select{font:inherit;width:100%;padding:10px;border:1px solid #cbd3df;border-radius:8px}input[type=file]{border:1px dashed #aeb8c8;background:#fafbfe}button{border:0;border-radius:8px;background:#2457d6;color:white;padding:10px 15px;font:inherit;font-weight:600;cursor:pointer;margin:8px 6px 0 0}button.secondary{background:#e9eef8;color:#30496f}button:disabled{opacity:.5}.status{white-space:pre-wrap;padding:10px 12px;border-radius:8px;background:#f1f4f9;color:#46536a;margin-top:12px}.error{background:#fff0ef;color:#a12e27}.ok{background:#edf8f1;color:#23633b}.note{font-size:12px;color:#788397}.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}.page{border:1px solid #e3e7ef;border-radius:8px;padding:8px;overflow-wrap:anywhere}.page img{width:100%;height:130px;object-fit:contain;background:#f4f5f7}pre,#markdown{white-space:pre-wrap;overflow-wrap:anywhere;background:#101827;color:#dce6f6;padding:14px;border-radius:8px;max-height:450px;overflow:auto}#markdown{background:#fbfcfe;color:#172033;border:1px solid #e1e6ef;line-height:1.7}.tabs{margin:10px 0}.tabs button{background:#e9eef8;color:#30496f}.tabs button.active{background:#2457d6;color:white}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap">
<h1>MinerU 章节批量解析测试台</h1><p>选择章节、批量上传多张教材图片，然后一次性提交该章节给 MinerU。图片先保存为章节页面，再由后端合并为多页 PDF。</p>
<section class="card"><h2>1. 选择教材与章节</h2><div class="grid"><div><label>教材</label><select id="book"></select></div><div><label>章节</label><select id="chapter"></select></div></div><button id="refresh" class="secondary">刷新列表</button><details style="margin-top:14px"><summary>创建教材或章节</summary><div class="grid"><div><label>教材名称</label><input id="bookTitle" placeholder="例如：软考高级教程"></div><div><label>版次（可选）</label><input id="edition" placeholder="第 2 版"></div></div><button id="createBook" class="secondary">创建教材</button><div class="grid"><div><label>章节编号</label><input id="chapterNo" type="number" min="1" value="1"></div><div><label>章节名称</label><input id="chapterTitle" placeholder="例如：计算机系统基础"></div></div><button id="createChapter" class="secondary">创建章节</button></details><div id="selectStatus" class="status">请选择教材和章节。</div></section>
<section class="card"><h2>2. 上传多张图片</h2><label>选择同一章节的多张图片（按文件选择顺序排列）</label><input id="files" type="file" accept="image/jpeg,image/png,image/webp,image/tiff" multiple><p class="note">建议首轮选择 3–5 张。支持 JPEG、PNG、WEBP、TIFF。上传成功后，图片会持久化到当前章节。</p><button id="upload">上传所选图片</button><button id="reloadPages" class="secondary">刷新页面列表</button><div id="uploadStatus" class="status">尚未上传。</div><div id="pages" class="pages"></div></section>
<section class="card"><h2>3. 一键批量解析</h2><p>处理当前章节全部活动页面。每次提交都会创建新的处理记录，并可能产生 MinerU 云端费用。请勿对同一批图片重复点击。</p><button id="run">开始 MinerU 批量解析</button><button id="history" class="secondary">刷新解析历史</button><div id="runStatus" class="status">等待提交。</div><div id="runs"></div></section>
<section class="card"><h2>4. 解析结果</h2><div class="tabs"><button id="tabMd" class="active">Markdown</button><button id="tabJson" class="secondary">JSON</button><button id="tabRun" class="secondary">完整记录</button></div><div id="markdown">解析完成后在这里显示 Markdown。</div><pre id="json" hidden></pre><pre id="runData" hidden></pre></section>
</main><script>
const el=id=>document.getElementById(id);
let chosenRun=null,tab="md";
async function api(url,opt){const res=await fetch(url,opt||{});const body=await res.text();let data;try{data=body?JSON.parse(body):null}catch{data=body}if(!res.ok){let d=data&&data.detail?data.detail:body;throw Error(typeof d==="string"?d:JSON.stringify(d))}return data}
function msg(id,text,kind){el(id).textContent=text;el(id).className="status "+(kind||"")}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function chapter(){return el("chapter").value}
async function books(keep){const old=keep||el("book").value;const a=await api("/api/books");el("book").innerHTML='<option value="">请选择教材</option>'+a.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.title)+(x.edition?" · "+esc(x.edition):"")+'</option>').join("");if(old)el("book").value=old;await chapters()}
async function chapters(keep){const id=el("book").value;if(!id){el("chapter").innerHTML='<option value="">请先选择教材</option>';return}const a=await api("/api/books/"+encodeURIComponent(id)+"/chapters");const old=keep||el("chapter").value;el("chapter").innerHTML='<option value="">请选择章节</option>'+a.map(x=>'<option value="'+esc(x.id)+'">第 '+x.chapter_number+' 章 · '+esc(x.title)+'</option>').join("");if(old)el("chapter").value=old;msg("selectStatus",el("chapter").value?"章节已选中。":"请选择章节。","ok")}
el("book").onchange=()=>chapters().catch(e=>msg("selectStatus",e.message,"error"));
el("refresh").onclick=()=>books().catch(e=>msg("selectStatus",e.message,"error"));
el("createBook").onclick=async()=>{try{const title=el("bookTitle").value.trim();if(!title)throw Error("请填写教材名称");const b=await api("/api/books",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:title,edition:el("edition").value.trim()||null})});await books(b.id);msg("selectStatus","教材已创建。现在可以创建章节。","ok")}catch(e){msg("selectStatus",e.message,"error")}};
el("createChapter").onclick=async()=>{try{const id=el("book").value;if(!id)throw Error("请先选择教材");const title=el("chapterTitle").value.trim();if(!title)throw Error("请填写章节名称");const c=await api("/api/books/"+encodeURIComponent(id)+"/chapters",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chapter_number:Number(el("chapterNo").value),title:title})});await chapters(c.id);msg("selectStatus","章节创建成功："+c.title,"ok")}catch(e){msg("selectStatus",e.message,"error")}};
async function pageList(){try{if(!chapter())throw Error("请先选择章节");const a=await api("/api/chapters/"+encodeURIComponent(chapter())+"/pages");el("pages").innerHTML=a.map((p,i)=>'<div class="page"><img loading="lazy" src="/api/chapters/'+encodeURIComponent(chapter())+'/pages/'+encodeURIComponent(p.id)+'/image"><small>第 '+(i+1)+' 页 · '+esc(p.original_filename)+'</small><small>'+((p.byte_size||0)/1048576).toFixed(2)+' MB</small></div>').join("");msg("uploadStatus","当前章节共有 "+a.length+" 张活动页面。","ok")}catch(e){msg("uploadStatus",e.message,"error")}}
el("upload").onclick=async()=>{try{if(!chapter())throw Error("请先选择章节");const fs=Array.from(el("files").files);if(!fs.length)throw Error("请选择图片");const f=new FormData();fs.forEach(x=>f.append("files",x));el("upload").disabled=true;msg("uploadStatus","正在上传 "+fs.length+" 张图片…");const r=await api("/api/chapters/"+encodeURIComponent(chapter())+"/pages",{method:"POST",body:f});msg("uploadStatus","上传成功：新增 "+r.pages.length+" 页，重复 "+r.duplicates.length+" 张。","ok");el("files").value="";await pageList()}catch(e){msg("uploadStatus",e.message,"error")}finally{el("upload").disabled=false}};
el("reloadPages").onclick=pageList;
el("chapter").onchange=()=>{msg("selectStatus","章节已选择。","ok");pageList();history()};
el("run").onclick=async()=>{try{if(!chapter())throw Error("请先选择章节");if(!confirm("将当前章节所有活动页面提交 MinerU，可能产生云端费用。确定继续？"))return;el("run").disabled=true;msg("runStatus","已提交请求，MinerU 正在处理。请等待接口返回，不要重复点击…");const r=await api("/api/chapters/"+encodeURIComponent(chapter())+"/ocr",{method:"POST"});chosenRun=r;render(r);msg("runStatus","处理结束："+r.status+" · "+r.provider+" · "+r.id,r.status==="succeeded"?"ok":"error");await history()}catch(e){msg("runStatus",e.message,"error")}finally{el("run").disabled=false}};
async function history(){try{if(!chapter())return;const a=await api("/api/chapters/"+encodeURIComponent(chapter())+"/ocr-runs");el("runs").innerHTML=a.map(r=>'<div class="status" style="cursor:pointer" data-id="'+esc(r.id)+'"><b>'+esc(r.status)+'</b> · '+esc(r.provider)+' · '+esc(r.created_at||"")+'<br><small>'+esc(r.id)+(r.error_message?" · "+esc(r.error_message):"")+'</small></div>').join("");el("runs").querySelectorAll("[data-id]").forEach(n=>n.onclick=()=>{const r=a.find(x=>x.id===n.dataset.id);chosenRun=r;render(r)})}catch(e){msg("runStatus",e.message,"error")}}
el("history").onclick=history;
function render(r){el("runData").textContent=JSON.stringify(r,null,2);const raw=r.raw_result||{},norm=r.normalized_result||{};const md=raw.markdown||raw.md_content||norm.markdown||norm.md_content||"未找到常见 Markdown 字段。请检查 JSON 或完整记录中的 artifacts。";el("markdown").textContent=typeof md==="string"?md:JSON.stringify(md,null,2);el("json").textContent=JSON.stringify({raw_result:r.raw_result,normalized_result:r.normalized_result,quality_report:r.quality_report},null,2);show(tab)}
function show(t){tab=t;el("markdown").hidden=t!=="md";el("json").hidden=t!=="json";el("runData").hidden=t!=="run";[["tabMd","md"],["tabJson","json"],["tabRun","run"]].forEach(x=>el(x[0]).className=x[1]===t?"active":"secondary")}
el("tabMd").onclick=()=>show("md");el("tabJson").onclick=()=>show("json");el("tabRun").onclick=()=>show("run");
books().catch(e=>msg("selectStatus",e.message,"error"));
</script></body></html>
