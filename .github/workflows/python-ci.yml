name: Python CI

on:
  # Development commits are verified locally with .\\test.bat.
  # Run hosted CI when a PR targets main, or manually from Actions.
  pull_request:
    branches: [main]
  workflow_dispatch:

# If a PR is updated repeatedly, keep only the newest verification run.
concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify Python version
        run: python --version
      - name: Verify database migrations
        run: |
          alembic upgrade head
          alembic current
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
